name: SAF desktop Windows preview

on:
  workflow_dispatch:
  push:
    branches: [feat/saf-engine-desktop]
    paths:
      - 'saf_desktop/**'
      - 'scripts/saf_desktop_entry.py'
      - 'tests/test_saf_*.py'
      - 'requirements-desktop.txt'
      - '.github/workflows/saf-desktop-windows.yml'

permissions:
  contents: read

jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preview dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6==6.8.3 pyinstaller==6.11.1
          python -m pip install -r requirements-desktop.txt
      - name: Compile desktop sources
        run: python -m compileall -q saf_desktop scripts/saf_desktop_entry.py
      - name: Test local diagnostics
        run: python -m unittest discover -s tests -p test_saf_diagnostics.py -v
      - name: Test desktop window
        run: python -m unittest discover -s tests -p test_saf_gui.py -v
      - name: Package isolated desktop
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name SAF_Engine --paths . scripts/saf_desktop_entry.py
      - name: Archive and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path dist/SAF_Engine/SAF_Engine.exe)) { throw 'Missing desktop executable' }
          Compress-Archive -Path dist/SAF_Engine -DestinationPath dist/SAF_Engine_Windows_Preview.zip
          $hash = (Get-FileHash dist/SAF_Engine_Windows_Preview.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SAF_Engine_Windows_Preview.zip" | Set-Content dist/SAF_Engine_Windows_Preview.sha256 -Encoding ascii
      - name: Upload unsigned preview
        uses: actions/upload-artifact@v4
        with:
          name: SAF-Engine-Windows-Preview
          path: |
            dist/SAF_Engine_Windows_Preview.zip
            dist/SAF_Engine_Windows_Preview.sha256
          if-no-files-found: error
          retention-days: 7
